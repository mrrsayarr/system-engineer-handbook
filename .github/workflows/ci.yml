name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint Markdown files
        run: npx --yes markdownlint-cli@0.45.0 "**/*.md" --ignore node_modules --config .markdownlint.json
